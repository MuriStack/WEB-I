<!DOCTYPE html>
<html>
    <head>
        <title>Box Model (Tamanho)</title>
        <style>
            .box{
                width: 300px;
                height: 200px;
                border: 20px solid;
                border-color: red green blue yellow;
                border-bottom-right-radius: 200px;
                border-top-left-radius: 200px;
                padding: 30px;
                margin: 30px;
                background-color: #ffbd00;
                font-size: 30px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="box">
            Conteúdo aqui
        </div>
    </body>
</html>
