<!DOCTYPE html>
<html>
    <head>
        <title>Exercício</title>
        <style>
            div {
                font-family: sans-serif;
                font-size: 14px;
                font-weight: bold;
                padding: 15px;
                margin-bottom: 20px;
            }
            #div1 {
                background-color: #aed6f1;
                border: 2px solid #000000;
                border-radius: 10px;
                width: 200px;
                height: 180px;
            }

            #div2 {
                background-color: rgb(5, 228, 5);
                border: 2px solid #e74c3c;
                border-radius: 20px;
                width: 250px;
                height: 100px;
                margin-left: 10px;
            }

            #div3 {
                background-color: #f1948a;
                border: 4px solid blue;
                border-radius: 8px;
                width: 300px;
                height: 190px;
            }

            #div4 {
                background-color: #fef9e7;
                border: 3px solid #7d3c98;
                border-radius: 40px;
                width: 150px;
                height: 150px;
            }
        </style>
    </head>
    <body>
        <div id="div1">
            Div 1
        </div>
        <div id="div2">
            Div 2
        </div>
        <div id="div3">
            Div 3
        </div>
        <div id="div4">
            Div 4
        </div>
    </body>
</html>
