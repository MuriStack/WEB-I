<!DOCTYPE html>
<html>
    <head>
        <title>Exercício</title>

        <style>
            body{
                font-family: Verdana, sans-serif;
            }

            ol{
                background-color: #fffacd;
            }

            li{
                color: #1b4f72;
                font-weight: bold;
                font-size: 18px;
                letter-spacing: 2px;
                line-height: 1.8;
            }

            p{
                background: #f0f0f0;
                font-size: 20px;
                line-height: 1.8;
            }
        </style>
    </head>
    <body>
        <p>
            Lista ordenada:
        </p>

        <ol type="1">
            <li>
                Item 1
            </li>
            <li>
                Item 2
            </li>
        </ol>

        <ol type="a" start="2">
            <li>
                Item 1
            </li>
            <li>
                Item 2
            </li>
        </ol>

        <ol type="A" start="5">
            <li>
                Item 1
            </li>
            <li>
                Item 2
            </li>
        </ol>

        <ol type="i" reversed>
            <li>
                Item 1
            </li>
            <li>
                Item 2
            </li>
        </ol>

        <ol type="I" start="3" reversed>
            <li>
                Item 1
            </li>
            <li>
                Item 2
            </li>
        </ol>
    </body>
</html>
