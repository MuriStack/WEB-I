<!DOCTYPE html>
<html>
    <head>
        <title>Exemplo cores e tipografia</title>
        <style>
            .arial-text{
                font-family: Arial, sans-serif;
            }

            .georgia-text{
                font-family: Georgia, serif;
            }

            .custom-text{
                font-family: 'Courier New', monospace;
            }
        </style>
    </head>
    <body>
        <p class="arial-text">Texto com a fonte Arial.</p>
        <p class="georgia-text">Texto com a fonte Georgia</p>
        <p class="custom-font">Texto com a fonte Courier New.</p>
    </body>
</html>
