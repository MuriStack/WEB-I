<!DOCTYPE html>
<html>
    <head>
        <title>Exemplo Flexbox</title>
        <link rel="stylesheet" href="ex_flexbox.css">
    </head>
    <body>
        <h1>FLEXBOX</h1>

        <section id="direction">
            <h3>flex-direction</h3>
            <div class="box">Caixa 1</div>
            <div class="box">Caixa 2</div>
            <div class="box">Caixa 3</div>
        </section>

        <section id="justify">
            <h3>justify-content</h3>
            <div class="box">Caixa 1</div>
            <div class="box">Caixa 2</div>
            <div class="box">Caixa 3</div>
        </section>

        <section id="align-items">
            <h3>align-items</h3>
            <div class="box">Caixa 1</div>
            <div class="box">Caixa 2</div>
            <div class="box">Caixa 3</div>
        </section>
    </body>
</html>
