<!DOCTYPE html>
<html>
    <head>
        <title>Exemplo de formulário 2</title>
    </head>
    <body>
       <form>
        <label for="pais">Viagem para:</label>
        <select name="pais" id="pais">
            <option value="brasil">Brasil</option>
            <option value="eua">Estados Unidos</option>
            <option value="portugal">Portugal</option>
        </select><br>
        <label for="mensagem">Descrição da viagem:</label>
        <textarea name="mensagem" id="mensagem" rows="4" cols="25"></textarea>
       </form> 
    </body>
</html>
